<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE Economics Questions Database</title>
    <!-- Standard Favicon (Fallback for older browsers) -->
    <link rel="icon" href="favicon.ico?v3" sizes="any">
    
    <!-- Modern SVG Favicon (Scales perfectly on high-res screens) -->
    <link rel="icon" href="icon.svg?v3" type="image/svg+xml">
    <link rel="stylesheet" href="css/main.css?v=2026.10.09.21">
</head>
<body>
    <!-- Global loading indicator -->
    <div id="loading-indicator">載入中...</div>

    <!-- The entire app UI is rendered into this container by js/ui-bootstrap.js -->
    <div id="app" class="container"></div>

    <!-- Scroll to top -->
    <button id="scroll-to-top" onclick="scrollToTop()" title="回到頂部" aria-label="回到頂部">↑</button>

    <!--
      Load order (fragile — do not reorder casually):
      1) Core globals/constants/config
      2) Data: auth → storage → schema → question-fields (defines questionFeatureOn)
         → storage-sync → condition-match (needs questionFeatureOn) → question-list-filter
      3) Templates + ui-bootstrap (injects #app DOM)
      4) UI logic: utils → filters… → stats-* → render/forms…
         → github-sync / access-rights / shared-assets / data-checks
         → poe-* (proxyRequest; poe-generate-client toggles body.poe-ai-allowed,
            which also CSS-gates AI解釋 card buttons in poe-modal.css)
         → ai-explanation (after poe-generate-client)
         → report-issue (after access-rights; prefers Poe, else git) → stem → main
    -->

    <!-- 1. Core state & configuration (must load first) -->
    <script src="js/globals.js?v=2026.10.09.1"></script>
    <script src="js/constants.js?v=2026.10.09.21"></script>
    <script src="js/config.js?v=2026.10.09.18"></script>

    <!-- 2. Data layer (questionFeatureOn in question-fields before condition-match) -->
    <script src="js/auth.js?v=2026.10.05.9"></script>
    <script src="js/storage-core.js?v=2026.10.09.7"></script>
    <script src="js/storage-filters.js?v=2026.10.09.15"></script>
    <script src="js/schema-version.js?v=2026.10.09.18"></script>
    <script src="js/question-fields.js?v=2026.10.09.21"></script>
    <script src="js/storage-sync.js?v=2026.10.09.15"></script>
    <script src="js/condition-match.js?v=2026.10.09.18"></script>
    <script src="js/question-list-filter.js?v=2026.10.05.8"></script>

    <!-- 3. UI Templates (HTML generators) + bootstrap (injects into #app) -->
    <script src="js/templates/template-header.js?v=2026.09.30.22"></script>
    <script src="js/templates/template-filters.js?v=2026.10.09.19"></script>
    <script src="js/templates/template-form.js?v=2026.10.09.15"></script>
    <script src="js/templates/template-tabs.js?v=2026.10.09.16"></script>
    <script src="js/templates/template-modals.js?v=2026.10.09.18"></script>
    <script src="js/ui-bootstrap.js?v=2026.09.30.22"></script>

    <!-- 4. Logic & interaction (DOM now exists) -->
    <script src="js/utils.js?v=2026.10.09.19"></script>
    <script src="js/sort.js?v=2026.10.09.7"></script>
    <script src="js/filters.js?v=2026.10.09.19"></script>
    <script src="js/filter-modal.js?v=2026.10.09.19"></script>
    <script src="js/advanced-filter.js?v=2026.10.09.1"></script>
    <script src="js/stats-filters.js?v=2026.10.09.18"></script>
    <script src="js/stats-explore.js?v=2026.10.09.16"></script>
    <script src="js/render.js?v=2026.10.09.16"></script>
    <script src="js/pagination.js?v=2026.09.30.22"></script>
    <script src="js/forms.js?v=2026.10.09.21"></script>
    <script src="js/bulk-edit.js?v=2026.10.09.21"></script>
    <script src="js/tabs.js?v=2026.10.09.13"></script>
    <script src="js/statistics.js?v=2026.10.09.13"></script>
    <script src="js/import-export.js?v=2026.10.05.10"></script>
    <script src="js/github-sync.js?v=2026.10.05.11"></script>
    <script src="js/access-rights.js?v=2026.10.09.18"></script>
    <script src="js/shared-assets.js?v=2026.10.09.18"></script>
    <script src="js/admin.js?v=2026.09.30.22"></script>
    <script src="js/data-checks.js?v=2026.10.09.1"></script>

    <!-- poe-generate-client before ai-explanation (hard Poe.proxyRequest); report-issue after access-rights -->
    <script src="js/poe-markdown.js?v=2026.10.02.1"></script>
    <script src="js/poe-generate-state.js?v=2026.10.09.18"></script>
    <script src="js/poe-generate-settings.js?v=2026.10.04.12"></script>
    <script src="js/poe-generate-client.js?v=2026.10.09.4"></script>
    <script src="js/poe-generate-history-store.js?v=2026.10.09.18"></script>
    <script src="js/poe-generate-modals.js?v=2026.10.09.13"></script>
    <script src="js/poe-generate-compose.js?v=2026.10.09.13"></script>
    <script src="js/poe-generate-history.js?v=2026.10.09.13"></script>
    <script src="js/poe-generate-run.js?v=2026.10.09.18"></script>
    <script src="js/ai-explanation.js?v=2026.10.09.18"></script>
    <script src="js/report-issue.js?v=2026.10.09.18"></script>
    <script src="js/stem-pattern-review.js?v=2026.10.09.9"></script>

    <!-- 5. Bootstrapper (must load last) -->
    <script src="js/main.js?v=2026.10.09.18"></script>
</body>
</html>
